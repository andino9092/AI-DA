appId: com.andino.aida
productName: AI-DA
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  runAfterFinish: true
publish:
  provider: github
  owner: andino9092
  repo: AI-DA
